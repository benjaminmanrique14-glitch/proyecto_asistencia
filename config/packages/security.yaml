security:
    enable_authenticator_manager: true
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\Profesor: 'auto'
        App\Entity\Administrador: 'auto'
    providers:
        profesores:
            entity:
                class: App\Entity\Profesor
                property: dni
        administradores:
            entity:
                class: App\Entity\Administrador
                property: username
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        admin:
            pattern: ^/admin
            lazy: true
            context: admin
            provider: administradores
            custom_authenticator: App\Security\AdminAuthenticator
            logout:
                path: admin_logout
                target: admin_login
        totem:
            pattern: ^/totem
            lazy: true
            context: totem
            provider: profesores
            user_checker: App\Security\ProfesorUserChecker
            custom_authenticator: App\Security\TotemAuthenticator
            logout:
                path: totem_logout
                target: totem_login
        main:
            pattern: ^/
            security: false
    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/totem/login, roles: PUBLIC_ACCESS }
        - { path: ^/totem, roles: ROLE_PROFESOR }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
